services:
  developer:
    build:
      context: .
      dockerfile: dev1/Dockerfile
    container_name: developer
    hostname: developer
    command: ["/home/dev/entrypoint.sh"]
    networks:
      - worldwideNET


  jump:
    build:
      context: .
      dockerfile: jump/Dockerfile
    container_name: jump
    hostname: jump
    networks:
      - worldwideNET
      - companyLAN

  internal:
    build:
      context: .
      dockerfile: stage/Dockerfile
    container_name: internal
    hostname: internal
    networks:
      - companyLAN

networks:
  worldwideNET:
  companyLAN:
