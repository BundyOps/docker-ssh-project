services:
  developer:
    image: myubuntu:1.0
    container_name: developer
    command: tail -f /dev/null
    #tty: true
    #stdin_open: true
    networks:
      - worldwideNET


  jump:
    image: myubuntu:1.0
    container_name: jump
    command: tail -f /dev/null
    networks:
      - worldwideNET
      - companyLAN

  internal:
    image: myubuntu:1.0
    container_name: internal
    command: tail -f /dev/null
    networks:
      - companyLAN

networks:
  worldwideNET:
  companyLAN:
