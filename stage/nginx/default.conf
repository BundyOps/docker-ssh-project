server {
    listen 80;
    server_name _;  # Match any hostname in container

    # Log files (container paths)
    access_log /var/log/nginx/flask-weather-quote-app-access.log;
    error_log /var/log/nginx/flask-weather-quote-app-error.log;

    # Maximum upload size
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy pass to Gunicorn
    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8000;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
